name: DiziKorea Otomatik Güncelleme

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır
    - cron: '0 */6 * * *'
  # GitHub panelinden tek tıkla elle tetikleme imkanı:
  workflow_dispatch:

jobs:
  update-streams:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tarayıcıyı Çalıştır
        run: |
          python scraper.py

      - name: Değişiklikleri Commit & Push Yap
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add dizikorea_catalog.json dizikorea.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik Güncelleme: DiziKorea Taze Yayınlar [skip ci]" && git push)
