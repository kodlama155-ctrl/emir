name: Cloudstream Plugin Builder

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "build"
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout Builds Branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Cloudstream Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp -v **/build/*.cs3 $GITHUB_WORKSPACE/builds/ || true
          cp -v build/plugins.json $GITHUB_WORKSPACE/builds/ || true

      - name: Deploy to builds branch
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --amend -m "Auto-build Cloudstream plugins: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push --force origin builds
